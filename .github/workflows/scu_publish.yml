name: "SkunkCrafts: Publish latest build..."

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Depot publish action(s) and channel(s)'
        required: true
        default: 'Publish to Latest only (keep Stable as-is)'
        type: choice
        options:
          - 'Publish to Latest only (keep Stable as-is)'
          - 'Publish to Stable only (keep Latest as-is)'
          - 'Promote Latest->Stable, then publish to Latest'
          - 'Publish to BOTH Latest AND Stable'
      create_release:
        description: 'Tag for release history (creates/updates tag)'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: "scu-depot-deploy"
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce master branch only
        run: |
          if [[ "${{ github.ref }}" != "refs/heads/master" ]]; then
            echo "::error::SkunkCrafts depot workflows may only be run from the 'master' branch (current ref: ${{ github.ref }})."
            exit 1
          fi

      - name: Checkout master source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Parse & validate COCKPIT_NOTES_VERSION
        id: ver
        run: |
          CN_VER=$(grep 'local COCKPIT_NOTES_VERSION' CockpitNotes.lua | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [[ -z "$CN_VER" ]]; then
            echo "::error::Could not parse COCKPIT_NOTES_VERSION from CockpitNotes.lua -- aborting before depot changes."
            exit 1
          fi
          echo "version=${CN_VER}" >> "$GITHUB_OUTPUT"
          echo "Validated COCKPIT_NOTES_VERSION: ${CN_VER}"

      - name: Verify gh-pages Latest depot exists when promoting first
        if: inputs.action == 'Promote Latest->Stable, then publish to Latest'
        run: |
          git fetch origin gh-pages:refs/remotes/origin/gh-pages || {
            echo "::error::Branch 'gh-pages' does not exist yet -- cannot promote existing Latest (depot/beta)."
            exit 1
          }
          if ! git cat-file -e origin/gh-pages:depot/beta/CockpitNotes/skunkcrafts_updater.cfg 2>/dev/null; then
            echo "::error::depot/beta/CockpitNotes/skunkcrafts_updater.cfg not found on gh-pages -- cannot promote existing Latest."
            exit 1
          fi

      - name: Stage & stamp SkunkCrafts depot payload(s)
        env:
          COCKPIT_NOTES_VERSION: ${{ steps.ver.outputs.version }}
          PUBLISH_ACTION: ${{ inputs.action }}
        run: |
          chmod +x deploy/stage.sh deploy/xpdepot.py
          case "$PUBLISH_ACTION" in
            "Publish to Latest only (keep Stable as-is)"|"Promote Latest->Stable, then publish to Latest")
              ./deploy/stage.sh beta --build-depot
              ;;
            "Publish to Stable only (keep Latest as-is)")
              ./deploy/stage.sh release --build-depot
              ;;
            "Publish to BOTH Latest AND Stable")
              ./deploy/stage.sh all --build-depot
              ;;
            *)
              echo "::error::Unknown publish action: $PUBLISH_ACTION"
              exit 1
              ;;
          esac

      - name: Checkout gh-pages depot branch
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git worktree add gh-pages-tree origin/gh-pages
            git -C gh-pages-tree checkout -B gh-pages origin/gh-pages
          else
            git worktree add --detach gh-pages-tree
            git -C gh-pages-tree checkout --orphan gh-pages
            git -C gh-pages-tree rm -rf . >/dev/null 2>&1 || true
            touch gh-pages-tree/.nojekyll
          fi

      - name: Apply atomic depot update & push gh-pages
        env:
          CN_VERSION: ${{ steps.ver.outputs.version }}
          PUBLISH_ACTION: ${{ inputs.action }}
        run: |
          STAGE_DEPOT_ROOT="$PWD/build/depot/depot"
          cd gh-pages-tree

          BETA_DIR="depot/beta/CockpitNotes"
          REL_DIR="depot/release/CockpitNotes"
          mkdir -p depot/beta depot/release

          case "$PUBLISH_ACTION" in
            "Publish to Latest only (keep Stable as-is)")
              rm -rf "$BETA_DIR"
              cp -a "$STAGE_DEPOT_ROOT/beta/CockpitNotes" "$BETA_DIR"
              COMMIT_MSG="chore(depot): publish ${CN_VERSION} to Latest (depot/beta)"
              ;;

            "Publish to Stable only (keep Latest as-is)")
              rm -rf "$REL_DIR"
              cp -a "$STAGE_DEPOT_ROOT/release/CockpitNotes" "$REL_DIR"
              COMMIT_MSG="chore(depot): publish ${CN_VERSION} to Stable (depot/release)"
              ;;

            "Promote Latest->Stable, then publish to Latest")
              if [[ ! -f "$BETA_DIR/skunkcrafts_updater.cfg" ]]; then
                echo "::error::Cannot promote: $BETA_DIR/skunkcrafts_updater.cfg missing on gh-pages."
                exit 1
              fi
              PROMOTED_VER=$(grep '^version|' "$BETA_DIR/skunkcrafts_updater.cfg" | head -n1 | cut -d'|' -f2 | tr -d '\r')
              rm -rf "$REL_DIR"
              cp -a "$BETA_DIR" "$REL_DIR"
              rm -rf "$BETA_DIR"
              cp -a "$STAGE_DEPOT_ROOT/beta/CockpitNotes" "$BETA_DIR"
              COMMIT_MSG="chore(depot): promote Latest (${PROMOTED_VER}) -> Stable, publish ${CN_VERSION} to Latest"
              ;;

            "Publish to BOTH Latest AND Stable")
              rm -rf "$BETA_DIR" "$REL_DIR"
              cp -a "$STAGE_DEPOT_ROOT/beta/CockpitNotes" "$BETA_DIR"
              cp -a "$STAGE_DEPOT_ROOT/release/CockpitNotes" "$REL_DIR"
              COMMIT_MSG="chore(depot): publish ${CN_VERSION} to Latest and Stable"
              ;;
          esac

          touch .nojekyll
          git add -A

          if git diff --cached --quiet; then
            DEPOT_RESULT="Depot files already matched ${CN_VERSION} (no gh-pages commit needed)."
            echo "$DEPOT_RESULT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "$COMMIT_MSG"
            git push origin gh-pages
            DEPOT_RESULT="$COMMIT_MSG"
          fi

          CUR_BETA="(none)"
          CUR_REL="(none)"
          [[ -f "$BETA_DIR/skunkcrafts_updater.cfg" ]] && CUR_BETA=$(grep '^version|' "$BETA_DIR/skunkcrafts_updater.cfg" | head -n1 | cut -d'|' -f2 | tr -d '\r')
          [[ -f "$REL_DIR/skunkcrafts_updater.cfg" ]] && CUR_REL=$(grep '^version|' "$REL_DIR/skunkcrafts_updater.cfg" | head -n1 | cut -d'|' -f2 | tr -d '\r')

          {
            echo "### SkunkCrafts Publish Summary"
            echo "- **Selected action:** \`${PUBLISH_ACTION}\`"
            echo "- **Depot update:** ${DEPOT_RESULT}"
            echo "- **Live \`Latest\` channel version:** \`${CUR_BETA}\` (\`depot/beta\`)"
            echo "- **Live \`Stable\` channel version:** \`${CUR_REL}\` (\`depot/release\`)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Package Release ZIP and update Git tag
        if: inputs.create_release == true
        env:
          COCKPIT_NOTES_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          ./deploy/stage.sh release --build-depot --package-zip

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "v${COCKPIT_NOTES_VERSION}" "${{ github.sha }}"
          git push origin "refs/tags/v${COCKPIT_NOTES_VERSION}" --force
          echo "- **Git tag & GitHub Release:** \`v${COCKPIT_NOTES_VERSION}\` (\`CockpitNotes_v${COCKPIT_NOTES_VERSION}.zip\`)" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish or update GitHub Release
        if: inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: CockpitNotes v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: build/dist/CockpitNotes_v${{ steps.ver.outputs.version }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
