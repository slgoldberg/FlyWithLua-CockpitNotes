name: 'SkunkCrafts: Copy "Latest" to "Stable"'

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "scu-depot-deploy"
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce master branch only
        run: |
          if [[ "${{ github.ref }}" != "refs/heads/master" ]]; then
            echo "::error::SkunkCrafts depot workflows may only be run from the 'master' branch (current ref: ${{ github.ref }})."
            exit 1
          fi

      - name: Checkout gh-pages depot branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-tree

      - name: Copy Latest (depot/beta) wholesale to Stable (depot/release)
        run: |
          cd gh-pages-tree
          BETA_DIR="depot/beta/CockpitNotes"
          REL_DIR="depot/release/CockpitNotes"

          if [[ ! -f "$BETA_DIR/skunkcrafts_updater.cfg" ]]; then
            echo "::error::Cannot promote: $BETA_DIR/skunkcrafts_updater.cfg does not exist on gh-pages."
            exit 1
          fi

          BETA_VER=$(grep '^version|' "$BETA_DIR/skunkcrafts_updater.cfg" | head -n1 | cut -d'|' -f2 | tr -d '\r')
          if [[ -z "$BETA_VER" ]]; then
            echo "::error::Cannot promote: 'version|' line missing or empty in $BETA_DIR/skunkcrafts_updater.cfg."
            exit 1
          fi

          OLD_REL_VER="(none)"
          if [[ -f "$REL_DIR/skunkcrafts_updater.cfg" ]]; then
            OLD_REL_VER=$(grep '^version|' "$REL_DIR/skunkcrafts_updater.cfg" | head -n1 | cut -d'|' -f2 | tr -d '\r')
          fi

          rm -rf "$REL_DIR"
          mkdir -p "$(dirname "$REL_DIR")"
          cp -a "$BETA_DIR" "$REL_DIR"

          git add -A "$REL_DIR"
          if git diff --cached --quiet; then
            MSG="No changes needed -- 'Stable' already matches 'Latest' (version ${BETA_VER})."
            echo "$MSG"
            {
              echo "### SkunkCrafts: Copy \"Latest\" to \"Stable\""
              echo "- **Status:** $MSG"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(depot): promote Latest (${BETA_VER}) -> Stable (was ${OLD_REL_VER})"
          git push origin gh-pages

          MSG="Successfully copied 'Latest' (version ${BETA_VER}) to 'Stable' (previously ${OLD_REL_VER})."
          echo "$MSG"
          {
            echo "### SkunkCrafts: Copy \"Latest\" to \"Stable\""
            echo "- **Promoted version:** \`${BETA_VER}\`"
            echo "- **Previous Stable version:** \`${OLD_REL_VER}\`"
            echo "- **Result:** $MSG"
          } >> "$GITHUB_STEP_SUMMARY"
